<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Guia interativo de estudos">
  <title>Guia de Estudos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="assets/css/study-guide.css?v=20260929-curvas">
  <link rel="stylesheet" href="assets/css/ahti-theme.css?v=20260929-preload">
  <link rel="stylesheet" href="assets/css/analytics.css?v=20260930-inline">
  <script defer src="assets/js/analytics.js?v=20260930-inline"></script>
  <script defer src="assets/js/ui-icons.js"></script>
  <script defer src="assets/js/progress.js?v=20260929-paginas"></script>
  <script defer src="assets/js/topic-pages.js?v=20260929-paginas"></script>
  <script defer src="assets/js/review-tabs.js?v=20260929-preload"></script>
  <script defer src="assets/js/study-guide.js?v=20260929-preload"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-brand-wrap">
      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Abrir menu lateral"><span data-icon="menu"></span></button>
      <div class="header-brand" aria-label="Matéria atual">
        <div class="brand-icon" id="subjectIcon"><span data-icon="book"></span></div>
        <div class="brand-text">
          <h1><span id="subjectTitle">Carregando…</span></h1>
          <p id="subjectSubtitle">Guia didático interativo</p>
        </div>
      </div>
    </div>

    <div class="header-progress-container">
      <div class="progress-info">
        <div class="progress-label-row">
          <span>Progresso:</span>
          <span class="progress-percentage" id="globalProgressPercent">0%</span>
        </div>
        <span class="progress-count" id="globalProgressCount">0/0 metas atingidas</span>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="globalProgressBar"></div>
        </div>
      </div>
      <div class="header-actions">
        <a href="index.html" class="btn-icon back-to-subjects" title="Voltar para matérias" aria-label="Voltar para matérias"><span data-icon="arrowLeft"></span></a>
      </div>
    </div>
  </header>

  <div class="main-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <input type="text" id="sidebarSearch" class="sidebar-search" placeholder="Buscar conceito ou módulo…">
      </div>
      <div class="sidebar-content" id="moduleNavigation"></div>
      <div class="sidebar-footer">
        <button id="btnResetProgress" class="quick-link-btn btn-reset"><span data-icon="rotate"></span><span>Resetar progresso desta matéria</span></button>
      </div>
    </aside>

    <main class="content-area" id="subjectContent">
      <div class="loading-state">
        <strong>Carregando guia…</strong>
        <span>Montando conteúdo e restaurando seu progresso.</span>
      </div>
    </main>
  </div>
</body>
</html>
