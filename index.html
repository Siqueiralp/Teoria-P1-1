<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Central de guias de aprendizado para as matérias da UTFPR.">
  <title>Central de Estudos | UTFPR</title>
  <link rel="stylesheet" href="assets/css/study-guide.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <script defer src="assets/js/progress.js"></script>
  <script defer src="assets/js/home.js"></script>
</head>
<body class="home-page">
  <header class="home-header">
    <div>
      <span class="home-eyebrow">Central de Estudos</span>
      <h1>Guias de aprendizado</h1>

    </div>
    <div class="home-overall-progress" aria-label="Progresso geral">
      <div class="progress-label-row">
        <span>Progresso geral</span>
        <strong id="overallProgressPercent">0%</strong>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="overallProgressBar"></div>
      </div>
      <span class="progress-count" id="overallProgressCount">0/0 metas concluídas</span>
    </div>
  </header>

  <main class="home-main">
    <section class="home-intro">
      <div>
        <h2>Matérias</h2>

      </div>
    </section>

    <section id="subjectsGrid" class="subjects-grid" aria-live="polite">
      <div class="home-loading">Carregando matérias…</div>
    </section>
  </main>


</body>
</html>
